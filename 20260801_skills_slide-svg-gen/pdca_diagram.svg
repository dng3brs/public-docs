<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title description">
  <title id="title">PDCAサイクル</title>
  <desc id="description">計画、実行、評価、改善を繰り返し、継続的に成果を高めるPDCAサイクルの図</desc>
  <defs>
    <marker id="arrow-primary" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6485C1"/>
    </marker>
  </defs>

  <rect width="900" height="900" fill="#FFFFFF"/>

